<section class="modulex-rf2" id="rf2-{{id}}">
  <div class="modulex-rf2-kart">
    {{rf2head}}
    {{rf2kapali}}
    <noscript><p class="modulex-rf2-kapali">{{noscript}}</p></noscript>
    <form class="modulex-rf2-form" novalidate data-rf2-form>
      {{rf2hizmet}}
      <div class="modulex-rf2-ikili">
        <label class="modulex-rf2-alan">
          <span class="modulex-rf2-etiket">{{dateLabel}} <span aria-hidden="true">*</span></span>
          <input type="date" name="tarih" required data-rf2-tarih />
        </label>
        <fieldset class="modulex-rf2-saatler">
          <legend class="modulex-rf2-etiket">{{timeLabel}} <span aria-hidden="true">*</span></legend>
          <div class="modulex-rf2-cipler">{{rf2saatler}}</div>
        </fieldset>
      </div>
      <div class="modulex-rf2-ikili">
        <label class="modulex-rf2-alan">
          <span class="modulex-rf2-etiket">{{nameLabel}} <span aria-hidden="true">*</span></span>
          <input type="text" name="ad" autocomplete="name" maxlength="120" required />
        </label>
        <label class="modulex-rf2-alan">
          <span class="modulex-rf2-etiket">{{phoneLabel}} <span aria-hidden="true">*</span></span>
          <input type="tel" name="telefon" autocomplete="tel" inputmode="tel" dir="ltr" maxlength="32" required />
        </label>
      </div>
      <label class="modulex-rf2-alan">
        <span class="modulex-rf2-etiket">{{noteLabel}}</span>
        <textarea name="not" rows="3" maxlength="1000"></textarea>
      </label>
      <label class="modulex-rf2-onay">
        <input type="checkbox" name="kvkk" required />
        <span>{{rf2kvkk}}</span>
      </label>
      <p class="modulex-rf2-hata" role="alert" data-rf2-hata hidden></p>
      <button type="submit" class="modulex-rf2-btn"{{rf2disabled}}>
        <span class="material-symbols-outlined" aria-hidden="true">{{rf2ikon}}</span>{{rf2btn}}
      </button>
      <p class="modulex-rf2-tamam" role="status" aria-live="polite" data-rf2-tamam></p>
    </form>
  </div>
  <script type="application/json" data-rf2-veri>{{rf2veri}}</script>
</section>

<style>
  /* Hızlı Randevu Formu (randevu-formu-2). Gönderim randevu-formu ile aynı: wa.me / mailto. */
  .modulex-rf2 {
    box-sizing: border-box; width: 100%;
    padding-block: clamp(32px, 6vw, 72px); padding-inline: clamp(16px, 4vw, 32px);
    background: --bgcolor--; color: --textcolor--;
  }
  .modulex-rf2 *, .modulex-rf2 *::before, .modulex-rf2 *::after { box-sizing: border-box; }
  .modulex-rf2 :where(span:not(.material-symbols-outlined), bdi, b, strong, em) { font: inherit; }
  .modulex-rf2-kart {
    max-width: --max--; margin-inline: auto; padding: clamp(20px, 4vw, 40px);
    border-radius: --radius--; background: --surface--; border: 1px solid --bordercolor--;
  }
  .modulex-rf2-title { margin: 0 0 6px; font-size: clamp(1.4rem, 1.1rem + 1.2vw, 2rem); line-height: 1.2; color: --textcolor--; }
  .modulex-rf2-desc { margin: 0 0 20px; line-height: 1.6; color: --mutedcolor--; }
  .modulex-rf2-form { display: grid; gap: 16px; }
  .modulex-rf2-ikili { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .modulex-rf2-alan { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .modulex-rf2-etiket { font-size: 0.92rem; font-weight: 700; color: --textcolor--; }
  .modulex-rf2-alan input, .modulex-rf2-alan select, .modulex-rf2-alan textarea {
    width: 100%; min-height: 44px; padding: 10px 12px; font: inherit; color: --textcolor--; background: --bgcolor--;
    border: 1px solid color-mix(in srgb, --textcolor-- 35%, transparent); border-radius: 10px;
  }
  .modulex-rf2-alan textarea { resize: vertical; }
  .modulex-rf2 [aria-invalid="true"] { border-color: --errcolor--; }
  .modulex-rf2-saatler { margin: 0; padding: 0; border: 0; min-width: 0; }
  .modulex-rf2-saatler legend { padding: 0; margin-bottom: 6px; }
  .modulex-rf2-cipler { display: flex; flex-wrap: wrap; gap: 6px; max-height: 148px; overflow-y: auto; padding: 2px; }
  .modulex-rf2-cip { position: relative; }
  .modulex-rf2-cip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .modulex-rf2-cip span {
    display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 999px;
    border: 1px solid --bordercolor--; background: --bgcolor--; font-size: 0.9rem; font-variant-numeric: tabular-nums;
  }
  .modulex-rf2-cip input:checked + span { background: --accent--; color: --accentText--; border-color: --accent--; font-weight: 700; }
  .modulex-rf2-cip input:focus-visible + span { outline: 3px solid --accent--; outline-offset: 2px; }
  .modulex-rf2-onay { display: flex; gap: 10px; align-items: flex-start; line-height: 1.5; font-size: 0.92rem; cursor: pointer; }
  .modulex-rf2-onay input { width: 20px; height: 20px; margin: 2px 0 0; flex: 0 0 auto; accent-color: --accent--; }
  .modulex-rf2-onay a { color: inherit; text-decoration: underline; }
  .modulex-rf2 input:focus-visible, .modulex-rf2 select:focus-visible, .modulex-rf2 textarea:focus-visible, .modulex-rf2-onay a:focus-visible {
    outline: 3px solid --accent--; outline-offset: 2px;
  }
  .modulex-rf2-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px;
    border: 0; border-radius: 999px; background: --accent--; color: --accentText--; font: inherit; font-weight: 700; cursor: pointer;
  }
  .modulex-rf2-btn:focus-visible { outline: 3px solid --textcolor--; outline-offset: 3px; }
  .modulex-rf2-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .modulex-rf2-hata { margin: 0; color: --errcolor--; font-weight: 600; }
  .modulex-rf2-tamam { margin: 0; color: --textcolor--; }
  .modulex-rf2-tamam:empty { display: none; }
  .modulex-rf2-kapali { margin: 0 0 16px; padding: 12px 14px; border-radius: 10px; background: --surface2--; color: --textcolor--; }

  @media (max-width: 640px) {
    .modulex-rf2-ikili { grid-template-columns: 1fr; }
    .modulex-rf2-btn { width: 100%; }
    [class*="modulex"] { max-width: 100%; box-sizing: border-box; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-rf2 *, .modulex-rf2 *::before, .modulex-rf2 *::after { animation: none !important; transition: none !important; }
  }
</style>

<script>
  (function () {
    var kok = document.getElementById("rf2-{{id}}");
    if (!kok || kok.getAttribute("data-rf2-hazir") === "1") { return; }
    kok.setAttribute("data-rf2-hazir", "1");
    var P = {};
    try { P = JSON.parse(kok.querySelector("[data-rf2-veri]").textContent || "{}"); } catch (e) { P = {}; }
    var M = P.m || {};
    var form = kok.querySelector("[data-rf2-form]");
    var tarih = kok.querySelector("[data-rf2-tarih]");
    var hata = kok.querySelector("[data-rf2-hata]");
    var tamam = kok.querySelector("[data-rf2-tamam]");
    function iso(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
    var bugun = new Date();
    var min = new Date(bugun.getFullYear(), bugun.getMonth(), bugun.getDate() + (P.lead || 0));
    var max = new Date(bugun.getFullYear(), bugun.getMonth(), bugun.getDate() + (P.max || 60));
    tarih.min = iso(min);
    tarih.max = iso(max);
    /* wa.me numarası: randevu-formu ile aynı kural (0xxx → 90xxx, 5xxxxxxxxx → 905xxxxxxxxx, 00 öneki atılır) */
    function waNumara(s) {
      var d = String(s || "").replace(/\D/g, "");
      if (d.indexOf("00") === 0) { return d.slice(2); }
      if (d.length === 11 && d.charAt(0) === "0") { return "90" + d.slice(1); }
      if (d.length === 10 && d.charAt(0) === "5") { return "90" + d; }
      return d;
    }
    function sablon(str, v) { return String(str || "").replace(/\{(\w+)\}/g, function (m, k) { return v[k] !== undefined ? String(v[k]) : m; }); }
    function hataYaz(metin, alan) {
      var eski = form.querySelectorAll('[aria-invalid="true"]');
      for (var i = 0; i < eski.length; i++) { eski[i].removeAttribute("aria-invalid"); }
      hata.textContent = metin || "";
      hata.hidden = !metin;
      if (alan) { alan.setAttribute("aria-invalid", "true"); alan.focus(); }
    }
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      tamam.textContent = "";
      if (!P.hedef) { return; }
      var f = form.elements;
      var saat = form.querySelector('input[name="saat"]:checked');
      if (f.hizmet && !f.hizmet.value) { hataYaz(M.zorunlu, f.hizmet); return; }
      if (!f.tarih.value) { hataYaz(M.zorunlu, f.tarih); return; }
      var gun = new Date(f.tarih.value + "T12:00:00").getDay() || 7;
      if (P.gunler && P.gunler.length && P.gunler.indexOf(gun) === -1) { hataYaz(M.kapali, f.tarih); return; }
      if (!saat) { hataYaz(M.zorunlu, form.querySelector('input[name="saat"]')); return; }
      if (!String(f.ad.value).trim()) { hataYaz(M.zorunlu, f.ad); return; }
      var rakam = String(f.telefon.value).replace(/\D/g, "").length;
      if (rakam < 10 || rakam > 15) { hataYaz(M.tel, f.telefon); return; }
      if (!f.kvkk.checked) { hataYaz(M.zorunlu, f.kvkk); return; }
      hataYaz("");
      var tarihMetni = f.tarih.value;
      try { tarihMetni = new Date(f.tarih.value + "T12:00:00").toLocaleDateString(document.documentElement.lang || undefined, { dateStyle: "full" }); } catch (e) { /* ISO kalır */ }
      var metin = sablon(P.sablon, {
        date: tarihMetni, time: saat.value, service: f.hizmet ? f.hizmet.value : "-",
        name: String(f.ad.value).trim(), phone: String(f.telefon.value).trim(), note: String(f.not.value).trim() || "-"
      });
      var url = P.submit === "mailto"
        ? "mailto:" + P.hedef + "?subject=" + encodeURIComponent(P.konu || "") + "&body=" + encodeURIComponent(metin.replace(/\n/g, "\r\n"))
        : "https://wa.me/" + waNumara(P.hedef) + "?text=" + encodeURIComponent(metin);
      if (P.submit === "mailto") { window.location.href = url; } else { window.open(url, "_blank", "noopener"); }
      tamam.textContent = M.tamam || "";
    });
  })();
</script>
